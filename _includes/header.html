<nav>
    <a href="{{site.baseurl}}/">{{ site.title }}</a>
    <ul>
        {% for item in site.navigation %}
        <li>
            <a href="{{ site.baseurl }}{{ item.url }}" {% if page.url contains item.url %}class="active" {% endif %}>
                {{ item.title }}
            </a>
        </li>
        {% endfor %}
    </ul>
</nav>
