---
layout: base
---

<header>
    <div class="header-content">
        {% if page.image %}
        <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
        {% else %}
        <h1>{{ page.title }}</h1> <!-- Muestra el título si no hay imagen -->
        {% endif %}
    </div>
</header>

<main>{{ content }}</main>
