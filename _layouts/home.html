---
layout: base
---

<main>
    {{ content }}

    <h2>Last Posts</h2>
    <ul>
        {% for post in site.posts %}
        <li class="{{post.custom_css}}">
            <a href="{{ post.url | relative_url }}">{{ post.title }} <span>↗</span></a>

            <small>{{ post.date | date: "%d %b %Y" }}</small>
        </li>
        {% endfor %}
    </ul>
</main>
